<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Error - Maternal Health</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #4FC3A1 0%, #2E8B77 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        
        .logo {
            margin-bottom: 30px;
        }
        
        .logo h1 {
            color: #4FC3A1;
            font-size: 28px;
            font-weight: 600;
        }
        
        .error-icon {
            font-size: 64px;
            color: #e74c3c;
            margin-bottom: 20px;
        }
        
        .error-message {
            color: #e74c3c;
            font-size: 18px;
            margin-bottom: 30px;
        }
        
        .btn {
            display: inline-block;
            padding: 15px 30px;
            background: #4FC3A1;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            transition: background 0.3s;
        }
        
        .btn:hover {
            background: #45B393;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>Maternal Health</h1>
        </div>
        
        <div class="error-icon">⚠️</div>
        
        <p class="error-message" th:text="${error}">Invalid or expired reset token</p>
        
        <a href="#" onclick="redirectToApp()" class="btn">Back to Login</a>
    </div>
    
    <script>
        function redirectToApp() {
            // This will redirect to the Flutter app or login page
            window.location.href = 'http://10.11.8.134:8080/api/auth/login-redirect';
        }
    </script>
</body>
</html>
